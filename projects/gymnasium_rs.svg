<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="gym-title gym-desc">
  <title id="gym-title">Reinforcement-learning environments and a learning curve</title>
  <desc id="gym-desc">Four panels show a balancing cart-pole, a car in a mountain valley, a swinging pendulum and a rising training return curve.</desc>
  <defs>
    <linearGradient id="gym-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101e32"/>
      <stop offset="1" stop-color="#1c304b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="180" fill="url(#gym-bg)"/>
  <!-- Cards crop this 4:3 artwork to 16:9, so the scene stays inside that band. -->
  <g transform="translate(120 90) scale(.84) translate(-120 -90)">
    <!-- A wall of environment panels, each running its own simulation. -->
    <g fill="#d9e6f4" fill-opacity=".04" stroke="#d9e6f4" stroke-opacity=".28" stroke-width="1.2">
      <rect x="18" y="18" width="96" height="68" rx="5"/>
      <rect x="126" y="18" width="96" height="68" rx="5"/>
      <rect x="18" y="94" width="96" height="68" rx="5"/>
      <rect x="126" y="94" width="96" height="68" rx="5"/>
    </g>
    <!-- Cart-pole balancing on its track. -->
    <path d="M28 72h76" stroke="#d9e6f4" stroke-opacity=".5" stroke-width="1.4"/>
    <path d="M68 62l7-31" stroke="#d9e6f4" stroke-width="3" stroke-linecap="round"/>
    <rect x="55" y="61" width="26" height="10" rx="2" fill="#a3b4f7" fill-opacity=".3" stroke="#d9e6f4" stroke-width="1.6"/>
    <circle cx="68" cy="62" r="2.5" fill="#83d9cc"/>
    <circle cx="75" cy="31" r="3.5" fill="#efbd82"/>
    <!-- Mountain car climbing towards its flag. -->
    <path d="M134 34c14 44 54 50 78 4" fill="none" stroke="#a3b4f7" stroke-width="2" stroke-linecap="round"/>
    <path d="M134 34c14 44 54 50 78 4v40h-78z" fill="#a3b4f7" fill-opacity=".12"/>
    <path d="M190 61l9-8 4 5-9 7z" fill="#83d9cc" stroke="#d9e6f4" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M210 40V25l8 3-8 3" fill="none" stroke="#efbd82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pendulum swinging about its pivot. -->
    <path d="M37 125A34 34 0 0 0 95 125" fill="none" stroke="#83d9cc" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="2 4"/>
    <path d="M66 108l20 22" stroke="#d9e6f4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="66" cy="108" r="3" fill="#1c304b" stroke="#d9e6f4" stroke-width="1.6"/>
    <circle cx="86" cy="130" r="6" fill="#efbd82"/>
    <!-- Training return rising as the agent learns. -->
    <path d="M137 152h76M137 152v-48" stroke="#d9e6f4" stroke-opacity=".45" stroke-width="1.2"/>
    <path d="M139 148c9-1 14-5 20-11s10-15 17-19 12-8 20-10 10-3 15-4" fill="none" stroke="#83d9cc" stroke-opacity=".2" stroke-width="6" stroke-linecap="round"/>
    <path d="M139 148c9-1 14-5 20-11s10-15 17-19 12-8 20-10 10-3 15-4" fill="none" stroke="#83d9cc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="211" cy="104" r="2.5" fill="#efbd82"/>
  </g>
</svg>
