<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="drl-title drl-desc">
  <title id="drl-title">Robot learning to grasp a cube</title>
  <desc id="drl-desc">An articulated robotic gripper reaches toward a cube beside a small 3D octree grid.</desc>
  <defs>
    <linearGradient id="drl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101e32"/>
      <stop offset="1" stop-color="#1c304b"/>
    </linearGradient>
    <linearGradient id="drl-cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83d9cc" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a3b4f7" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <rect width="240" height="180" fill="url(#drl-bg)"/>
  <g fill="none" stroke="#d9e6f4" stroke-opacity=".08" stroke-width=".7">
    <path d="M16 42h208M16 66h208M16 90h208M16 114h208M16 138h208"/>
    <path d="M40 22v136M64 22v136M88 22v136M112 22v136M136 22v136M160 22v136M184 22v136M208 22v136"/>
  </g>
  <!-- Octree cells show the 3D observation around the target. -->
  <g stroke="#a3b4f7" stroke-width="1.15" stroke-linejoin="round">
    <path d="M164 59l17-10 17 10v20l-17 10-17-10z" fill="#a3b4f7" fill-opacity=".08"/>
    <path d="M181 49v20m-17-10 17 10 17-10m-17 10v20" fill="none"/>
    <path d="M164 59h17m-17 20h17m17-20v20" fill="none" stroke-opacity=".58"/>
    <path d="M164 79l-10 6v15l10 6 10-6V85z" fill="#83d9cc" fill-opacity=".2" stroke="#83d9cc"/>
    <path d="M181 89l10-6 10 6v12l-10 6-10-6z" fill="#a3b4f7" fill-opacity=".15"/>
  </g>
  <g fill="none" stroke="#83d9cc" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round" opacity=".78">
    <path d="M143 77q11-15 23-18"/>
  </g>
  <!-- Cube target, drawn as a solid three-face voxel. -->
  <g stroke="#d9e6f4" stroke-width="1.6" stroke-linejoin="round">
    <path d="M111 43l15-9 15 9-15 9z" fill="#a3b4f7" fill-opacity=".36"/>
    <path d="M111 43v19l15 9V52z" fill="url(#drl-cube)"/>
    <path d="M126 52v19l15-9V43z" fill="#83d9cc" fill-opacity=".24"/>
    <path d="M126 52v19" fill="none" stroke="#83d9cc" stroke-opacity=".8"/>
  </g>
  <!-- Arm links and large, readable joints. -->
  <path d="M66 139h43" stroke="#d9e6f4" stroke-width="5" stroke-linecap="round"/>
  <path d="M88 137l18-34 26-22" fill="none" stroke="#d9e6f4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88 137l18-34 26-22" fill="none" stroke="#a3b4f7" stroke-width="2" stroke-linecap="round"/>
  <path d="M73 143h29v7H73z" fill="#a3b4f7" fill-opacity=".28" stroke="#d9e6f4" stroke-width="1.5"/>
  <circle cx="88" cy="137" r="7" fill="#1c304b" stroke="#83d9cc" stroke-width="2.5"/>
  <circle cx="106" cy="103" r="6" fill="#1c304b" stroke="#83d9cc" stroke-width="2.5"/>
  <circle cx="132" cy="81" r="5" fill="#1c304b" stroke="#d9e6f4" stroke-width="2"/>
  <!-- Open fingers approach opposite faces of the target. -->
  <path d="M130 77l-8-11-5 1m16 12 8-11 5 1" fill="none" stroke="#83d9cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 151h184" stroke="#d9e6f4" stroke-opacity=".38" stroke-width="1.2"/>
  <circle cx="211" cy="29" r="2" fill="#efbd82"/>
</svg>
