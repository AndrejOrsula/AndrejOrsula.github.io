<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="srb-title srb-desc">
  <title id="srb-title">Planetary rover with robotic manipulator</title>
  <desc id="srb-desc">A wheeled research rover extends its jointed arm across a rocky planetary surface beneath a distant planet and orbital arc.</desc>
  <defs>
    <linearGradient id="srb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101e32"/>
      <stop offset="1" stop-color="#1c304b"/>
    </linearGradient>
    <linearGradient id="srb-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3b4f7" stop-opacity=".18"/>
      <stop offset="1" stop-color="#83d9cc" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect width="240" height="180" fill="url(#srb-bg)"/>
  <g fill="#d9e6f4">
    <circle cx="31" cy="37" r="1.2" opacity=".65"/>
    <circle cx="67" cy="24" r="1" opacity=".48"/>
    <circle cx="103" cy="43" r="1.3" opacity=".56"/>
    <circle cx="145" cy="25" r="1" opacity=".62"/>
    <circle cx="218" cy="67" r="1.2" opacity=".55"/>
  </g>
  <!-- Distant world and orbital sweep. -->
  <path d="M151 53c17-24 52-29 77-11" fill="none" stroke="#a3b4f7" stroke-width="1.4" stroke-opacity=".56"/>
  <circle cx="190" cy="50" r="18" fill="#a3b4f7" fill-opacity=".2" stroke="#d9e6f4" stroke-width="1.5"/>
  <path d="M174 47q15 5 30-7M178 60q11-5 27 0" fill="none" stroke="#83d9cc" stroke-width="2" stroke-opacity=".62"/>
  <circle cx="218" cy="34" r="2" fill="#efbd82"/>
  <!-- Uneven ground gives the rover a clear foothold. -->
  <path d="M22 143q28-8 53-2t48 0q30-8 54 0t41 1v20H22z" fill="url(#srb-ground)" stroke="#d9e6f4" stroke-width="1.3" stroke-opacity=".6"/>
  <path d="M37 157l12-3 7 2m115 0 13-4 9 2" fill="none" stroke="#a3b4f7" stroke-width="1.2" stroke-opacity=".55"/>
  <!-- Six-wheel chassis. -->
  <path d="M73 119h92l10 17H65z" fill="#a3b4f7" fill-opacity=".2" stroke="#d9e6f4" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M83 116l8-14h54l8 14z" fill="#d9e6f4" fill-opacity=".14" stroke="#d9e6f4" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M88 108h16v8H88z" fill="#83d9cc" fill-opacity=".56"/>
  <circle cx="76" cy="139" r="9" fill="#101e32" stroke="#d9e6f4" stroke-width="2"/>
  <circle cx="114" cy="140" r="9" fill="#101e32" stroke="#d9e6f4" stroke-width="2"/>
  <circle cx="155" cy="139" r="9" fill="#101e32" stroke="#d9e6f4" stroke-width="2"/>
  <g fill="#83d9cc">
    <circle cx="76" cy="139" r="3"/><circle cx="114" cy="140" r="3"/><circle cx="155" cy="139" r="3"/>
  </g>
  <!-- Linked shoulder, elbow, wrist and gripper joints. -->
  <path d="M108 103L96 77l27-21" fill="none" stroke="#d9e6f4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M108 103L96 77l27-21" fill="none" stroke="#a3b4f7" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="108" cy="103" r="6" fill="#1c304b" stroke="#83d9cc" stroke-width="2.5"/>
  <circle cx="96" cy="77" r="5.5" fill="#1c304b" stroke="#83d9cc" stroke-width="2.5"/>
  <circle cx="123" cy="56" r="4.5" fill="#1c304b" stroke="#d9e6f4" stroke-width="2"/>
  <path d="M121 52l-4-9-5 1m13 10 8-5 4 3" fill="none" stroke="#83d9cc" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="140" cy="54" r="2" fill="#efbd82"/>
</svg>
